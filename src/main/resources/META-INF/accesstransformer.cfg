# Adding a building to the vanilla village pools needs the list the jigsaw generator
# actually picks from. There is no API for it: a datapack can only replace a template
# pool, never append to one, and replacing 'minecraft:village/plains/houses' would
# throw away every other mod's buildings along with any vanilla ones added later.
public net.minecraft.world.level.levelgen.structure.pools.StructureTemplatePool templates
public net.minecraft.world.level.levelgen.structure.pools.StructureTemplatePool rawTemplates
# Hiding a limb on the body is half a job while a chestplate is over it: the armour is
# its own humanoid model with its own arms and it decides for itself which to show. The
# fix is to replace the vanilla armour layer with one that also knows what is missing -
# and replacing it means reaching the list it is already in. There is no API for that:
# addLayer only appends, and appending would draw armour over the cape.
public net.minecraft.client.renderer.entity.LivingEntityRenderer layers
