name: Bug report
description: Something in Triage is broken or behaves differently than described.
title: "[Bug] "
labels: ["bug", "needs-info"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Fill in the loader, Minecraft version, Triage version and a log — without those the report usually cannot be reproduced.

  - type: input
    id: mod-version
    attributes:
      label: Triage version
      placeholder: "2.2.0"
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options:
        - NeoForge
        - Forge
        - Fabric
    validations:
      required: true

  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      options:
        - "1.21.1"
        - "1.20.1"
        - Other / not listed
    validations:
      required: true

  - type: input
    id: loader-version
    attributes:
      label: Loader version
      placeholder: "NeoForge 21.1.248 / Forge 47.4.0 / Fabric Loader 0.16.5"

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log or crash report
      description: Paste `latest.log`, `debug.log` or the crash report. A link to a paste service is fine.
      render: text
    validations:
      required: false

  - type: input
    id: other-mods
    attributes:
      label: Other mods
      description: Especially TaCZ, Sable, Ragdollified or Iris, and anything that changes damage, health or rendering.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am using the file for my loader and Minecraft version.
          required: true
        - label: I have removed the other Triage jars from the mods folder.
          required: true
        - label: I have read the README and the known limitations.
          required: true
