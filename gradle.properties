# Loom wants a good deal of memory to remap Minecraft the first time.
org.gradle.jvmargs=-Xmx3G
# Gradle 8.8 (which is what Loom 1.7 supports) cannot run on the newest JDK on this
# machine, and Loom wants 21 anyway - so the build is pinned to it rather than left to
# whatever happens to be first on the path.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.11.10-hotspot

org.gradle.daemon=true
org.gradle.parallel=true

# Environment
minecraft_version=1.21.1
loader_version=0.16.5
fabric_version=0.102.0+1.21.1
# The one number that is not free to choose: Mojang mappings, so that every file
# carried across from the other two trees reads the same names they do.
yarn_mappings=official

## Mod Properties
mod_id=triage
mod_name=Triage
mod_license=MIT
mod_version=2.2.0
mod_group_id=com.claudemods.triage
mod_authors=yungspider

mod_description=Seven body parts with their own health, instead of one health bar. Limbs black out, bones crack before they break, and a wound you never cleaned turns into a fever and then into something worse. Treating any of it means bandaging, splinting and stitching it yourself.
