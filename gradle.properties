## Publishing
# Tokens are NOT stored here - they come from the MODRINTH_TOKEN and
# CURSEFORGE_TOKEN environment variables. Fill these in once the projects
# exist on the sites; see PUBLISHING.md.
modrinth_project_id=
curseforge_project_id=

mod_description=Seven body parts with their own health, instead of one health bar. Limbs black out, bones crack before they break, and a wound you never cleaned turns into a fever and then into something worse. Treating any of it means bandaging, splinting and stitching it yourself.
